<div class="financial-tags">
    <p class="financial-tags__label">
        <cb-icon-tag class="financial-tags__icon"></cb-icon-tag>
        TAGS
    </p>

    <div class="financial-tags__tags-row">
        <div class="financial-tags__tags">
            <span class="financial-tags__tag" *ngFor="let tag of tags; let i = index">
                <span class="financial-tags__tag-name">{{ tag.descricao }}</span>
                <button
                    type="button"
                    class="financial-tags__tag-remove"
                    (click)="removeTag(i)"
                    [attr.aria-label]="'Remover tag ' + tag.descricao"
                >
                    <cb-icon-close></cb-icon-close>
                </button>
            </span>

            <button
                *ngIf="!tagInputOpen"
                type="button"
                class="financial-tags__tag-add-btn"
                (click)="openTagInput()"
                aria-label="Adicionar tag"
            >
                <cb-icon-add></cb-icon-add>
            </button>

            <div class="financial-tags__tag financial-tags__tag--new" *ngIf="tagInputOpen">
                <span class="financial-tags__tag-sizer" aria-hidden="true">{{ tagNewSizerMirror }}</span>
                <input
                    #novaTagInput
                    type="text"
                    class="financial-tags__tag-field"
                    [formControl]="novaTagCtrl"
                    [placeholder]="novaTagPlaceholder"
                    aria-label="Texto da nova tag"
                    (keydown.enter)="onNovaTagEnter($event)"
                    (keydown.escape)="closeTagInput()"
                    (blur)="onNovaTagBlur()"
                />
            </div>
        </div>
    </div>
</div>
