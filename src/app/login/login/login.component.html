<div class="fundo">
    <img class="logo" src="../../../assets/images/login/carmel_logo.png"/>
    <h3>Workflow <span>&</span> Projetos</h3>

    <div class="container">
        <div class="titulo">
            <h4>Bem-Vindo</h4>
            <p id="subtitulo">Faça login para acessar o sistema</p>
        </div>
        <form [formGroup]="loginForm" (ngSubmit)="login()">
            <div class="alert-message" *ngIf="showAlert" [@alert-message]="state">
                {{ message }}
            </div>
            <label>Usuário:</label>
            <div class="spaceInput">
                <mat-icon>person</mat-icon>
                <input 
                    formControlName="email"
                    type="text"
                    placeholder="Digite seu usuário">
            </div>
            <label>Senha:</label>
            <div class="spaceInput">
                <mat-icon>lock</mat-icon>
                <input 
                    formControlName="password"
                    [type]="showPassword ? 'text' : 'password'"
                    placeholder="Digite sua senha">
                    <button type="button" class="eye-toggle" (click)="togglePasswordVisibility()" [attr.aria-label]="showPassword ? 'Ocultar senha' : 'Mostrar senha'">
                    <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
                    </button>
            </div>
            <div class="checkbox">
                <input type="checkbox">
                <p>Lembrar-me</p>
            </div>
            <button type="submit" class="btn cb-button">Entrar</button>
        </form>
        <a [routerLink]="['/forget-password']">Esqueceu a senha?</a>
    </div>
</div>
